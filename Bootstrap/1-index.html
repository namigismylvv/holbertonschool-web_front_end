<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Holberton - Web Stack - Bootstrap</title>
    <meta
      name="description"
      content="Bootstrap is a free and open-source CSS framework"
    />
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
      integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="row">
      <div class="col-lg p-2 text-white text-center bg-primary">Primary</div>
      <div class="col-lg p-2 text-white text-center bg-success">Success</div>
      <div class="col-lg p-2 text-white text-center bg-danger">Danger</div>
      <div class="col-lg p-2 text-white text-center bg-warning">Warning</div>
    </div>

    <hr />

    <div class="row">
      <div class="p-2 col-sm bg-primary text-center text-white">Primary</div>
      <div class="p-2 col-sm bg-success text-center text-white">Success</div>
      <div class="p-2 col-sm bg-danger text-center text-white">Danger</div>
      <div class="p-2 col-sm bg-warning text-center text-white">Warning</div>
    </div>

    <hr />

    <div class="row">
      <div class="bg-primary p-2 text-center text-white col-lg-2">Primary</div>
      <div class="bg-success p-2 text-center text-white col-lg-4">Success</div>
      <div class="bg-danger p-2 text-center text-white col-lg-6">Danger</div>
    </div>

    <hr />

    <div class="row">
      <div>Primary</div>
      <div>Success</div>
      <div>Danger</div>
      <div>Warning</div>
    </div>

    <hr />

    <div class="row">
      <div>Primary</div>
      <div>Success</div>
    </div>

    <hr />

    <div class="row">
      <div>Primary</div>
      <div>Success</div>
      <div>Danger</div>
    </div>
  </body>
</html>
